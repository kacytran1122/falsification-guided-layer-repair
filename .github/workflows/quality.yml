name: Quality checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "matplotlib>=3.8" "numpy>=1.26"
      - run: test "$(git log --format='%an <%ae>' | sort -u)" = "Anonymous Authors <anonymous@invalid.example>"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/plot_summary.py
      - run: python scripts/plot_diagnostics.py
